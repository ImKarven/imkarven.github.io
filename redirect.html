<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <style>
            @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap");
            body {
                background-color: #020618;
            }

            #container {
                font-family: "Jetbrains Mono";
                width: auto;
                height: auto;

                position: absolute;
                top: 50%;
                left: 50%;
                transform: translateY(-50%) translateX(-50%);
            }

            #heading {
                color: white;
                text-align: center;
                font-size: 4rem;
            }

            #description {
                color: gray;
                font-size: 1.5rem;
            }
        </style>

        <title>Redirecting...</title>
    </head>

    <body>
        <div id="container"></div>

        <script>
            checkLinkThenRedirect();

            async function checkLinkThenRedirect() {
                const queryString = window.location.search;
                const parameters = new URLSearchParams(queryString);
                const linkParemeter = parameters.get("link");
                if (!linkParemeter) {
                    show404();
                    return;
                }
                const fetchData = await fetch("links.txt");
                const rawLinks = await fetchData.text();
                const lines = rawLinks.split("\n");
                for (const line of lines) {
                    const component = line.split("=");
                    const linkName = component[0];
                    const linkUrl = component[1];
                    if (linkName != linkParemeter) continue;
                    if (!linkUrl) continue;
                    window.location.href = linkUrl;
                    return;
                }

                show404();
            }

            function show404() {
                const container = document.getElementById("container");
                if (!container) return;
                container.innerHTML =
                    '<h1 id="heading">404</h1><p id="description">Redirect not found.</p>';
            }
        </script>
    </body>
</html>
